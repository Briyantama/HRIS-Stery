name: Go Services CI

on:
  push:
    paths:
      - 'services/**'
      - 'gen/go/**'
      - 'go.work'
      - 'go.work.sum'
  pull_request:
    paths:
      - 'services/**'
      - 'gen/go/**'

env:
  GO_VERSION: '1.24'

jobs:
  # Detect which services changed to run targeted builds
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      auth:         ${{ steps.filter.outputs.auth }}
      employee:     ${{ steps.filter.outputs.employee }}
      attendance:   ${{ steps.filter.outputs.attendance }}
      leave:        ${{ steps.filter.outputs.leave }}
      notification: ${{ steps.filter.outputs.notification }}
      audit:        ${{ steps.filter.outputs.audit }}
      ai:           ${{ steps.filter.outputs.ai }}
      shared:       ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth-service/**'
            employee:
              - 'services/employee-service/**'
            attendance:
              - 'services/attendance-service/**'
            leave:
              - 'services/leave-service/**'
            notification:
              - 'services/notification-service/**'
            audit:
              - 'services/audit-service/**'
            ai:
              - 'services/ai-service/**'
            shared:
              - 'services/_shared/**'
              - 'gen/go/**'

  lint:
    name: Lint — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.changes.outputs.auth == 'true' || needs.changes.outputs.shared == 'true' }}
          - service: employee-service
            changed: ${{ needs.changes.outputs.employee == 'true' || needs.changes.outputs.shared == 'true' }}
          - service: attendance-service
            changed: ${{ needs.changes.outputs.attendance == 'true' || needs.changes.outputs.shared == 'true' }}
          - service: leave-service
            changed: ${{ needs.changes.outputs.leave == 'true' || needs.changes.outputs.shared == 'true' }}
          - service: notification-service
            changed: ${{ needs.changes.outputs.notification == 'true' || needs.changes.outputs.shared == 'true' }}
          - service: audit-service
            changed: ${{ needs.changes.outputs.audit == 'true' || needs.changes.outputs.shared == 'true' }}
          - service: ai-service
            changed: ${{ needs.changes.outputs.ai == 'true' || needs.changes.outputs.shared == 'true' }}
    if: ${{ matrix.changed == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/${{ matrix.service }}
          args: --timeout=5m

  test-unit:
    name: Unit Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.changes.outputs.auth == 'true' || needs.changes.outputs.shared == 'true' }}
          - service: employee-service
            changed: ${{ needs.changes.outputs.employee == 'true' || needs.changes.outputs.shared == 'true' }}
          - service: leave-service
            changed: ${{ needs.changes.outputs.leave == 'true' || needs.changes.outputs.shared == 'true' }}
    if: ${{ matrix.changed == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Run unit tests
        working-directory: services/${{ matrix.service }}
        run: go test -short -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: services/${{ matrix.service }}/coverage.out
          flags: ${{ matrix.service }}

  test-integration:
    name: Integration Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    strategy:
      matrix:
        service: [auth-service, employee-service, leave-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hris_admin
          POSTGRES_PASSWORD: hris_admin_secret
          POSTGRES_DB: hris_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: --entrypoint "nats-server --jetstream"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/

      - name: Run migrations
        run: |
          migrate -path services/${{ matrix.service }}/migrations \
                  -database "postgres://hris_admin:hris_admin_secret@localhost:5432/hris_test_db?sslmode=disable" \
                  up

      - name: Verify rollback
        run: |
          migrate -path services/${{ matrix.service }}/migrations \
                  -database "postgres://hris_admin:hris_admin_secret@localhost:5432/hris_test_db?sslmode=disable" \
                  down -all
          migrate -path services/${{ matrix.service }}/migrations \
                  -database "postgres://hris_admin:hris_admin_secret@localhost:5432/hris_test_db?sslmode=disable" \
                  up

      - name: Run integration tests
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: "postgres://hris_admin:hris_admin_secret@localhost:5432/hris_test_db?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          NATS_URL: "nats://localhost:4222"
          INTEGRATION: "true"
        run: go test -run Integration -race -timeout 120s ./...

  build:
    name: Build Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-integration]
    strategy:
      matrix:
        service:
          - auth-service
          - employee-service
          - attendance-service
          - leave-service
          - notification-service
          - audit-service
          - ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push on PR)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/hris-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
