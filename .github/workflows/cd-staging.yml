name: Deploy to Staging

on:
  push:
    branches:
      - main

concurrency:
  group: staging-deploy
  cancel-in-progress: false  # never cancel a deploy mid-flight

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: HRIS-Stery
      - uses: actions/checkout@v4
        with:
          repository: Briyantama/stery-kit
          path: stery-kit
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: HRIS-Stery/apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/hris-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/hris-api:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.hris-stery.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=kubeconfig" >> $GITHUB_ENV
      - name: Run database migrations
        run: |
          kubectl delete pod migrate-${{ github.sha }} -n hris-staging --ignore-not-found
          kubectl run migrate-${{ github.sha }} \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/hris-api:${{ github.sha }} \
            --restart=Never \
            --namespace=hris-staging \
            --env="DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" \
            --command -- /usr/local/bin/migrate up
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/migrate-${{ github.sha }} --timeout=120s -n hris-staging \
            || { kubectl logs pod/migrate-${{ github.sha }} -n hris-staging; exit 1; }
      - name: Roll out api
        run: |
          kubectl set image deployment/hris-api api=${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/hris-api:${{ github.sha }} -n hris-staging
          kubectl rollout status deployment/hris-api -n hris-staging --timeout=180s
      - name: Smoke test
        run: curl -sf https://staging.hris-stery.com/healthz
