# NATS Server Configuration — Development
# Production config lives in deploy/k8s/

jetstream {
  store_dir: "/data"
  max_mem_store: 256MB
  max_file_store: 2GB
}

# Monitoring
http: 8222

# Logging (verbose in dev)
debug: false
trace: false
logtime: true

# Max payload 8MB (for document upload notifications)
max_payload: 8MB

# Authorization — dev uses simple accounts.
# Production uses NKeys with explicit ACLs per ADR-0003.
accounts {
  HRIS {
    users [
      { user: "auth-service",         password: "dev-auth-secret",         permissions: { publish: ["hris.identity.>"], subscribe: [] } }
      { user: "employee-service",     password: "dev-employee-secret",     permissions: { publish: ["hris.workforce.>"], subscribe: ["hris.identity.user.registered"] } }
      { user: "attendance-service",   password: "dev-attendance-secret",   permissions: { publish: ["hris.operations.attendance.>"], subscribe: ["hris.workforce.employee.created"] } }
      { user: "leave-service",        password: "dev-leave-secret",        permissions: { publish: ["hris.operations.leave.>"], subscribe: ["hris.workforce.employee.created"] } }
      { user: "notification-service", password: "dev-notification-secret", permissions: { publish: ["realtime.>"], subscribe: ["hris.operations.leave.>", "hris.compensation.payroll.>"] } }
      { user: "audit-service",        password: "dev-audit-secret",        permissions: { publish: ["hris.audit.>"], subscribe: ["hris.>"] } }
      { user: "ai-service",           password: "dev-ai-secret",           permissions: { publish: ["hris.intelligence.>"], subscribe: ["hris.talent.>"] } }
    ]
  }
}
