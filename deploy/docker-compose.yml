# Local development stack for HRIS-Stery. Secrets come from .env (see .env.example).
# The API image builds from the stery-suite parent so that stery-kit/go is in the build context.
name: hris-dev

services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: ["--requirepass=${REDIS_PASSWORD:?}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    ulimits:
      memlock: -1
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket hris-documents
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket hris-documents

  # Containerized API for image checks: `docker compose --profile api up`. `make up` runs it with go run instead.
  api:
    profiles: ["api"]
    build:
      context: ../..
      dockerfile: HRIS-Stery/apps/api/Dockerfile
    depends_on:
      dragonfly:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    env_file: ../.env
    environment:
      PORT: "8000"
      REDIS_ADDR: dragonfly:6379
      S3_ENDPOINT: http://rustfs:9000
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  rustfs-data:
