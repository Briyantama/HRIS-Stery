syntax = "proto3";

package hris.audit.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hris-stery/hris-stery/gen/go/hris/audit/v1;auditv1";

service AuditService {
  rpc Record(RecordAuditRequest) returns (RecordAuditResponse) {
    option (google.api.http) = {
      post: "/v1/audit/entries"
      body: "*"
    };
  }

  rpc Query(QueryAuditRequest) returns (QueryAuditResponse) {
    option (google.api.http) = {
      get: "/v1/audit/entries"
    };
  }

  rpc GetEntry(GetAuditEntryRequest) returns (AuditEntry) {
    option (google.api.http) = {
      get: "/v1/audit/entries/{entry_id}"
    };
  }
}

enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  LOGIN = 1;
  LOGOUT = 2;
  EMPLOYEE_CREATED = 10;
  EMPLOYEE_TERMINATED = 11;
  LEAVE_REQUESTED = 20;
  LEAVE_APPROVED = 21;
  NOTIFICATION_SENT = 30;
}

enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  USER = 1;
  EMPLOYEE = 2;
  LEAVE = 3;
  NOTIFICATION = 4;
}

message AuditEntry {
  string entry_id = 1;
  string tenant_id = 2;
  string actor_id = 3;
  AuditAction action = 4;
  ResourceType resource_type = 5;
  string resource_id = 6;
  string description = 7;
  bool success = 8;
  string error_message = 9;
  map<string, string> changes = 10;
  google.protobuf.Timestamp created_at = 11;
}

message RecordAuditRequest {
  string tenant_id = 1;
  string actor_id = 2;
  AuditAction action = 3;
  ResourceType resource_type = 4;
  string resource_id = 5;
  string description = 6;
  bool success = 7;
  string error_message = 8;
  map<string, string> changes = 9;
}

message RecordAuditResponse {
  string entry_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message QueryAuditRequest {
  string tenant_id = 1;
  string actor_id = 2;
  AuditAction action = 3;
  ResourceType resource_type = 4;
  string resource_id = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message QueryAuditResponse {
  repeated AuditEntry entries = 1;
  int32 total_count = 2;
}

message GetAuditEntryRequest {
  string tenant_id = 1;
  string entry_id = 2;
}
